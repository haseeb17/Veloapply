name: Update generated docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/companies.json"
      - "templates/**"
      - "tools/**"

concurrency:
  group: listings-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate README and ATS directory
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 -m tools.cli generate
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ATS.md
          git diff --cached --quiet || git commit -m "Regenerate README and ATS directory"
          git push
