name: Device lab

on:
  pull_request:
    paths:
      - "device-lab/**"
      - ".github/workflows/device-lab.yml"
  push:
    branches: [main]
    paths:
      - "device-lab/**"
      - ".github/workflows/device-lab.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests
        env:
          PYTHONPATH: src
        run: python3 -m pytest -q
